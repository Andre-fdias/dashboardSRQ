<!-- Tabela de Ocorrências -->
<div class="glass-panel p-4 rounded-3xl z-10 overflow-hidden">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
        <h6 class="text-xs font-bold tracking-wider text-blue-400 uppercase flex items-center gap-2">
            <i class="fa-solid fa-list-check"></i> Registro de Ocorrências

                <span class="w-2 h-2 rounded-full bg-green-500"></span> Atendida
            </span>

                <span class="w-2 h-2 rounded-full bg-red-500"></span> QTA (Cancelada)
            </span>
        </div>
    </div>
    
    <div class="overflow-x-auto w-full">
        <table id="table-ocorrencias" class="table-dark-custom table w-full" style="width:100%">
            <thead>
                <tr>
                    <th class="text-xs uppercase text-[#5a6f8a] border-b border-white/5 py-3">Data</th>

                    <th class="text-xs uppercase text-[#5a6f8a] border-b border-white/5 py-3 text-center">Vítimas</th>
                    <th class="text-xs uppercase text-[#5a6f8a] border-b border-white/5 py-3 text-center">Óbitos</th>
                    <th class="text-xs uppercase text-[#5a6f8a] border-b border-white/5 py-3">Comandante</th>
                </tr>
            </thead>
            <tbody id="ocorrencias-body">
            </tbody>
        </table>
    </div>
