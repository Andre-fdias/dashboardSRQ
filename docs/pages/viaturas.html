<!-- Título e Controles de Visualização -->
<div class="glass-panel p-4 rounded-3xl z-10 mb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-yellow-500/10 border border-yellow-500/20 flex items-center justify-center text-yellow-400 text-lg">
            <i class="fa-solid fa-truck"></i>
        </div>
        <div>
            <h6 class="text-base font-bold tracking-wider text-white uppercase flex items-center gap-2">
                Painel de Viaturas
            </h6>
            <span class="text-xs text-[#5a6f8a]" id="viaturas-count-badge">Carregando viaturas...</span>
        </div>
    </div>
    
    <div class="flex items-center gap-2">
        <!-- Alternador Cards / Tabela -->
        <div class="flex bg-[#0a0e17] p-1 rounded-xl border border-white/10" id="view-mode-toggle">
            <button id="btn-view-cards" class="px-3 py-1.5 rounded-lg text-xs font-bold text-white bg-white/10 border border-white/20 transition flex items-center gap-1.5">
                <i class="fa-solid fa-table-cells-large"></i> Cards
            </button>
            <button id="btn-view-table" class="px-3 py-1.5 rounded-lg text-xs font-bold text-[#cbd5e1] hover:text-white transition flex items-center gap-1.5">
                <i class="fa-solid fa-list"></i> Tabela
            </button>
        </div>
    </div>
</div>

<!-- Toolbar de Filtros e Busca -->
<div class="glass-panel p-4 rounded-3xl z-10 mb-4 flex flex-col lg:flex-row justify-between gap-4 items-stretch lg:items-center">
    <div class="w-full lg:w-96 relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-[#5a6f8a] text-sm"></i>
        <input type="search" id="search-viatura-card" placeholder="Buscar por prefixo, placa, modelo, base..." 
            class="w-full bg-[#0a0e17] border border-white/10 rounded-xl text-white pl-10 pr-4 py-2.5 text-xs focus:outline-none focus:border-yellow-500/50 transition-colors" />
    </div>
    
    <div class="flex gap-2 w-full lg:w-auto overflow-x-auto custom-scrollbar pb-1 lg:pb-0" id="viaturas-filters">
        <button data-filter="ALL" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-white bg-white/20 border border-white/20 transition active-filter whitespace-nowrap">TODAS</button>
        <button data-filter="OPERANDO" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-[#cbd5e1] border border-white/10 hover:bg-white/10 transition whitespace-nowrap">OPERANDO</button>
        <button data-filter="RESERVA" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-[#cbd5e1] border border-white/10 hover:bg-white/10 transition whitespace-nowrap">RESERVA</button>
        <button data-filter="BAIXADO" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-[#cbd5e1] border border-white/10 hover:bg-white/10 transition whitespace-nowrap">BAIXADO</button>
        <button data-filter="ALERTAS" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-[#cbd5e1] border border-white/10 hover:bg-white/10 transition whitespace-nowrap">ALERTAS</button>
        <button data-filter="AVARIAS" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-[#cbd5e1] border border-white/10 hover:bg-white/10 transition whitespace-nowrap">AVARIAS</button>
    </div>
</div>

<!-- Visualização em Cards -->
<div id="viaturas-cards-view" class="z-10 mb-4">
    <div id="viaturas-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
        <!-- Renderizado dinamicamente via JS -->
    </div>
</div>

<!-- Visualização em Tabela -->
<div id="viaturas-table-view" class="glass-panel p-4 rounded-3xl z-10 overflow-hidden mb-4 hidden">
    <div class="overflow-x-auto w-full">
        <table id="table-viaturas-lista" class="table-dark-custom table w-full" style="width:100%">
            <thead>
                <tr>
                    <th class="text-xs uppercase text-[#5a6f8a] border-b border-white/5 py-3 text-left">Prefixo</th>
                    <th class="text-xs uppercase text-[#5a6f8a] border-b border-white/5 py-3 text-left">Placa</th>
                    <th class="text-xs uppercase text-[#5a6f8a] border-b border-white/5 py-3 text-left">Modelo</th>
                    <th class="text-xs uppercase text-[#5a6f8a] border-b border-white/5 py-3 text-left">Status</th>
                    <th class="text-xs uppercase text-[#5a6f8a] border-b border-white/5 py-3 text-left">Base / OPM</th>
                    <th class="text-xs uppercase text-[#5a6f8a] border-b border-white/5 py-3 text-center">Alertas / Avarias</th>
                    <th class="text-xs uppercase text-[#5a6f8a] border-b border-white/5 py-3 text-right">Ação</th>
                </tr>
            </thead>
            <tbody>
                <!-- Renderizado via JS -->
            </tbody>
        </table>
    </div>
</div>
