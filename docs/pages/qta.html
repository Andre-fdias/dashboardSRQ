<div class="fade-in max-w-7xl mx-auto w-full">
    <!-- Header -->
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h2 class="text-2xl md:text-3xl font-bold text-white tracking-tight flex items-center gap-3">
                <i class="fa-solid fa-ban text-red-500"></i> Análise de QTA
            </h2>
            <p class="text-sm text-[#5a6f8a] mt-1">Ocorrências canceladas, falsos alarmes ou trotes</p>
        </div>
    </div>

    <!-- KPIs -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <!-- Card 1 -->
        <div class="glass-panel p-4 md:p-5 flex items-center gap-4 hover-lift">
            <div class="w-12 h-12 rounded-xl bg-red-500/10 flex items-center justify-center text-red-500 border border-red-500/20">
                <i class="fa-solid fa-ban text-xl"></i>
            </div>
            <div>
                <p class="text-xs text-[#5a6f8a] uppercase font-bold tracking-wider">Total QTA</p>
                <div class="flex items-baseline gap-2 mt-1">
                    <span class="text-2xl font-bold text-white" id="kpi-qta-total">--</span>
                    <span class="text-xs text-gray-500">ocorrências</span>
                </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="glass-panel p-4 md:p-5 flex items-center gap-4 hover-lift">
            <div class="w-12 h-12 rounded-xl bg-blue-500/10 flex items-center justify-center text-blue-500 border border-blue-500/20">
                <i class="fa-solid fa-truck-fire text-xl"></i>
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-xs text-[#5a6f8a] uppercase font-bold tracking-wider truncate">Vtr com mais QTA</p>
                <div class="flex items-baseline gap-2 mt-1">
                    <span class="text-sm md:text-base font-bold text-white truncate block w-full" id="kpi-qta-vtr">--</span>
                </div>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="glass-panel p-4 md:p-5 flex items-center gap-4 hover-lift">
            <div class="w-12 h-12 rounded-xl bg-yellow-500/10 flex items-center justify-center text-yellow-500 border border-yellow-500/20">
                <i class="fa-solid fa-fire text-xl"></i>
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-xs text-[#5a6f8a] uppercase font-bold tracking-wider truncate">Natureza mais comum</p>
                <div class="flex items-baseline gap-2 mt-1">
                    <span class="text-sm font-bold text-white truncate block w-full" id="kpi-qta-nat">--</span>
                </div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <!-- Gráfico Motivos / Naturezas -->
        <div class="glass-panel p-5 flex flex-col min-h-[400px]">
            <h3 class="text-sm font-bold text-[#b0c0d8] uppercase tracking-wider mb-4 flex items-center gap-2">
                <i class="fa-solid fa-chart-bar text-[#5a6f8a]"></i> Top Naturezas de QTA
            </h3>
            <div id="chart-qta-nat" class="flex-1 w-full h-[350px]"></div>
        </div>

        <!-- Gráfico Cidades -->
        <div class="glass-panel p-5 flex flex-col min-h-[400px]">
            <h3 class="text-sm font-bold text-[#b0c0d8] uppercase tracking-wider mb-4 flex items-center gap-2">
                <i class="fa-solid fa-city text-[#5a6f8a]"></i> QTA por Cidade
            </h3>
            <div id="chart-qta-cidade" class="flex-1 w-full h-[350px]"></div>
        </div>
    </div>

    <!-- Tabela Detalhada -->
    <div class="glass-panel p-5 mb-6 flex flex-col min-h-[400px]">
        <h3 class="text-sm font-bold text-[#b0c0d8] uppercase tracking-wider mb-4 flex items-center gap-2">
            <i class="fa-solid fa-table-list text-[#5a6f8a]"></i> Detalhamento de Cancelamentos
        </h3>
        <div class="flex-1 w-full relative overflow-x-auto pb-4">
            <table id="table-qta-detalhe" class="w-full text-left custom-datatable stripe hover whitespace-nowrap">
                <!-- DataTable via JS -->
            </table>
        </div>
    </div>
</div>
