<div class="flex flex-col gap-6 w-full relative z-10">
    
    <!-- Filtros Abastecimento -->
    <div class="glass-panel p-4 rounded-3xl w-full flex flex-col md:flex-row gap-4 justify-between items-center">
        <h6 class="text-sm font-bold tracking-wider text-emerald-400 uppercase flex items-center gap-2">
            <i class="fa-solid fa-filter"></i> Filtros
        </h6>
        
        <div class="flex flex-wrap gap-4 items-end">
            <!-- Busca por Prefixo -->
            <div class="flex flex-col gap-1 w-40">
                <label class="text-[10px] font-bold text-[#5a6f8a] uppercase tracking-wider">Prefixo Viatura</label>
                <div class="relative">
                    <i class="fa-solid fa-truck-fire absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs z-10 pointer-events-none"></i>
                    <select id="abast-filter-prefixo" class="w-full bg-[#0a0e17]/50 border border-white/5 rounded-xl py-2 pl-9 pr-8 text-xs text-[#e5e7eb] focus:outline-none focus:border-emerald-500/50 transition appearance-none cursor-pointer">
                        <option value="">TODAS AS VIATURAS</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 text-[10px] pointer-events-none"></i>
                </div>
            </div>

            <!-- Período Start -->
            <div class="flex flex-col gap-1 w-36">
                <label class="text-[10px] font-bold text-[#5a6f8a] uppercase tracking-wider">Data Início</label>
                <input type="date" id="abast-filter-dateStart" class="w-full bg-[#0a0e17]/50 border border-white/5 rounded-xl px-3 py-2 text-xs text-[#e5e7eb] focus:outline-none focus:border-emerald-500/50 transition [color-scheme:dark]">
            </div>

            <!-- Período End -->
            <div class="flex flex-col gap-1 w-36">
                <label class="text-[10px] font-bold text-[#5a6f8a] uppercase tracking-wider">Data Fim</label>
                <input type="date" id="abast-filter-dateEnd" class="w-full bg-[#0a0e17]/50 border border-white/5 rounded-xl px-3 py-2 text-xs text-[#e5e7eb] focus:outline-none focus:border-emerald-500/50 transition [color-scheme:dark]">
            </div>
        </div>
    </div>

    <!-- Mini Cards Dashboard -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 w-full">
        <!-- Gasto Total -->
        <div class="glass-panel p-5 rounded-3xl relative overflow-hidden group">
            <div class="absolute -right-6 -top-6 text-red-500/10 group-hover:text-red-500/20 transition-colors duration-500">
                <i class="fa-solid fa-money-bill-wave text-8xl transform -rotate-12"></i>
            </div>
            <div class="relative z-10">
                <p class="text-[10px] font-bold text-[#5a6f8a] uppercase tracking-widest mb-1">Custo Total</p>
                <div class="flex items-end gap-2">
                    <span class="text-3xl font-black text-white" id="abast-card-valor">R$ 0,00</span>
                </div>
            </div>
        </div>

        <!-- Volume Total -->
        <div class="glass-panel p-5 rounded-3xl relative overflow-hidden group">
            <div class="absolute -right-6 -top-6 text-blue-500/10 group-hover:text-blue-500/20 transition-colors duration-500">
                <i class="fa-solid fa-droplet text-8xl transform -rotate-12"></i>
            </div>
            <div class="relative z-10">
                <p class="text-[10px] font-bold text-[#5a6f8a] uppercase tracking-widest mb-1">Volume Consumido</p>
                <div class="flex items-end gap-2">
                    <span class="text-3xl font-black text-white" id="abast-card-volume">0 L</span>
                </div>
            </div>
        </div>

        <!-- Consumo Médio (Km/L) -->
        <div class="glass-panel p-5 rounded-3xl relative overflow-hidden group">
            <div class="absolute -right-6 -top-6 text-purple-500/10 group-hover:text-purple-500/20 transition-colors duration-500">
                <i class="fa-solid fa-gauge-high text-8xl transform -rotate-12"></i>
            </div>
            <div class="relative z-10">
                <p class="text-[10px] font-bold text-[#5a6f8a] uppercase tracking-widest mb-1">Consumo Médio</p>
                <div class="flex items-end gap-2">
                    <span class="text-3xl font-black text-white" id="abast-card-kml">--</span>
                    <span class="text-xs font-bold text-gray-400 mb-1.5">km/l</span>
                </div>
            </div>
        </div>

        <!-- Ocorrências (Registros) -->
        <div class="glass-panel p-5 rounded-3xl relative overflow-hidden group">
            <div class="absolute -right-6 -top-6 text-emerald-500/10 group-hover:text-emerald-500/20 transition-colors duration-500">
                <i class="fa-solid fa-gas-pump text-8xl transform -rotate-12"></i>
            </div>
            <div class="relative z-10">
                <p class="text-[10px] font-bold text-[#5a6f8a] uppercase tracking-widest mb-1">Qtd. Abastecimentos</p>
                <div class="flex items-end gap-2">
                    <span class="text-3xl font-black text-white" id="abast-card-count">0</span>
                    <span class="text-xs font-bold text-gray-400 mb-1.5">registros</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabela -->
    <div class="glass-panel p-0 rounded-3xl w-full overflow-hidden flex flex-col">
        <div class="p-4 border-b border-white/5 flex justify-between items-center bg-white/5">
            <h6 class="text-sm font-bold tracking-wider text-white uppercase flex items-center gap-2">
                <i class="fa-solid fa-table-list text-emerald-400"></i> Histórico EB SÃO ROQUE
            </h6>
        </div>
        
        <div class="w-full overflow-x-auto max-h-[50vh]">
            <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                <thead class="sticky top-0 bg-[#0a0e17] z-10 shadow-md">
                    <tr>
                        <th class="px-4 py-3 font-bold text-[#5a6f8a] uppercase tracking-wider text-[10px] border-b border-white/5">Data</th>
                        <th class="px-4 py-3 font-bold text-[#5a6f8a] uppercase tracking-wider text-[10px] border-b border-white/5">Viatura</th>
                        <th class="px-4 py-3 font-bold text-[#5a6f8a] uppercase tracking-wider text-[10px] border-b border-white/5">Placa</th>
                        <th class="px-4 py-3 font-bold text-[#5a6f8a] uppercase tracking-wider text-[10px] border-b border-white/5">Responsável</th>
                        <th class="px-4 py-3 font-bold text-[#5a6f8a] uppercase tracking-wider text-[10px] border-b border-white/5">Km</th>
                        <th class="px-4 py-3 font-bold text-[#5a6f8a] uppercase tracking-wider text-[10px] border-b border-white/5 text-right">Volume</th>
                        <th class="px-4 py-3 font-bold text-[#5a6f8a] uppercase tracking-wider text-[10px] border-b border-white/5 text-right">Valor</th>
                        <th class="px-4 py-3 font-bold text-[#5a6f8a] uppercase tracking-wider text-[10px] border-b border-white/5">Posto</th>
                    </tr>
                </thead>
                <tbody id="abast-table-body" class="divide-y divide-white/5 text-[#b0c0d8]">
                    <!-- Skeleton Loader -->
                    <tr class="animate-pulse">
                        <td class="px-4 py-3"><div class="h-4 bg-white/10 rounded w-16"></div></td>
                        <td class="px-4 py-3"><div class="h-4 bg-white/10 rounded w-20"></div></td>
                        <td class="px-4 py-3"><div class="h-4 bg-white/10 rounded w-16"></div></td>
                        <td class="px-4 py-3"><div class="h-4 bg-white/10 rounded w-24"></div></td>
                        <td class="px-4 py-3"><div class="h-4 bg-white/10 rounded w-16"></div></td>
                        <td class="px-4 py-3"><div class="h-4 bg-white/10 rounded w-12 ml-auto"></div></td>
                        <td class="px-4 py-3"><div class="h-4 bg-white/10 rounded w-12 ml-auto"></div></td>
                        <td class="px-4 py-3"><div class="h-4 bg-white/10 rounded w-32"></div></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
